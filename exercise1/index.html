<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			
			margin: 0;
			overflow: hidden;
			background-color: #AAAAAA;
			background-attachment: fixed !important;
			}
		</style>
		<style>
			body {
				font-family: Monospace;
				margin: 0px;
				overflow: hidden;
			}
		</style>
	</head>
	<body>

<script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
<script type="importmap">
  {
	"imports": {
	  "three": "https://unpkg.com/three@0.183.0/build/three.module.js",
	  "three/addons/": "https://unpkg.com/three@0.183.0/examples/jsm/"
	}
  }
</script>

<script type="module">
   import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI } from "three/addons/libs/lil-gui.module.min.js";


var camera, controls, scene, renderer, container;
var plan;

// VIDEO AND THE ASSOCIATED TEXTURE
var video,videoTexture;

// GUI
var gui;

init();
animate();

function init () {
	
    container = document.createElement( 'div' );
	document.body.appendChild( container );
	
	scene = new THREE.Scene(); 

	renderer = new THREE.WebGLRenderer( { antialias: true, alpha: true } );
	renderer.autoClear = false;
	renderer.setPixelRatio( window.devicePixelRatio );
	renderer.setSize( window.innerWidth, window.innerHeight );
	renderer.shadowMap.enabled = false;

	container.appendChild( renderer.domElement );

	camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.001, 10 );
	camera.position.z = 0.7;
	controls = new OrbitControls( camera, renderer.domElement );
	controls.minDistance = 0.005;
	controls.maxDistance = 1.0;
	controls.enableRotate = true;
	controls.addEventListener( 'change', render );
	controls.update();

	video = document.createElement('video');
	video.src = '../video.mp4';
	video.load();
	video.muted = true;
	video.loop = true;

	video.onloadeddata = function () 
	{ 
	videoTexture = new THREE.VideoTexture( video );
	videoTexture.minFilter = THREE.NearestFilter;
	videoTexture.magFilter = THREE.NearestFilter;
	videoTexture.generateMipmaps = false; 
	videoTexture.format = THREE.RGBAFormat;
	
	var geometry = new THREE.PlaneGeometry( 1, video.videoHeight/video.videoWidth );
	var material = new THREE.MeshBasicMaterial( { map: videoTexture, side : THREE.DoubleSide } );
	plan = new THREE.Mesh( geometry, material );
	plan.receiveShadow = false;
	plan.castShadow = false;
	scene.add( plan );

	var pausePlayObj =
	{
    	pausePlay: function () 
    	{
			if (!video.paused)
			{
				console.log ( "pause" );
				video.pause();
			}
			else
			{
				console.log ( "play" );
				video.play();
			}
		},
		add10sec: function ()
		{
			video.currentTime = video.currentTime + 10;
			console.log ( video.currentTime  );
		}
	};
	
	gui = new GUI();
    gui.add(pausePlayObj,'pausePlay').name ('Pause/play video');
    gui.add(pausePlayObj,'add10sec').name ('Add 10 seconds');

	video.play();

	};
	
	window.addEventListener( 'resize', onWindowResize, false );
}

function render () {
	renderer.clear();
	
	renderer.render( scene, camera );
	
}

function animate() {	
	requestAnimationFrame(animate);
	controls.update();
	render();
}

function onWindowResize () {
	camera.aspect = ( window.innerWidth / window.innerHeight);
	camera.updateProjectionMatrix();
	renderer.setSize( window.innerWidth, window.innerHeight );
	render();
}

</script>
</body>
</html>
